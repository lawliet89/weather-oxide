name: Build

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint (Stable)
        run: cargo clippy -- -D warnings

      - name: Unit Tests
        run: cargo test

  build:
    name: Build
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            flags:
            use_cross: false
            runs_on: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            use_cross: true
            runs_on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            use_cross: true
            runs_on: ubuntu-latest
          - target: armv7-unknown-linux-musleabihf
            use_cross: true
            runs_on: ubuntu-latest
    uses: ./.github/workflows/build_reusable.yaml
    with:
      target: ${{ matrix.target }}
      cargo_flags: ${{ matrix.flags }}
      release: ${{ github.ref == 'refs/heads/main' }}
      use_cross: ${{ matrix.use_cross }}
      runs_on: ${{ matrix.runs_on }}
    secrets: inherit

  #####################
  # Docker Builds
  #####################
  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6

      # x64 Linux MUSL
      - uses: actions/download-artifact@v6
        with:
          name: x86_64-unknown-linux-musl
          path: builds/linux/amd64

      # armv7hf Linux MUSL
      - uses: actions/download-artifact@v6
        with:
          name: armv7-unknown-linux-musleabihf
          path: builds/linux/arm/v7

      # arch64 Linux MUSL
      - uses: actions/download-artifact@v6
        with:
          name: aarch64-unknown-linux-musl
          path: builds/linux/arm64

      - name: 'Echo download path'
        run: |
          find . -name "weather-oxide" -exec chmod +x {} \;
          tree -p builds/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Ref: https://github.com/containerd/containerd/blob/main/platforms/platforms.go
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile.gha
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Weather Scraper
