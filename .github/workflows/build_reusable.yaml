name: Build (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Rust Target Triple
        type: string
        required: true
      cargo_flags:
        description: Cargo flags
        type: string
        default: ""
        required: false
      release:
        description: Do a release build
        type: boolean
        default: true
        required: false
      use_cross:
        description: Build with cross (containerised cross-compilation)
        type: boolean
        default: false
        required: false
      runs_on:
        description: What to run on
        type: string
        default: "ubuntu-latest"
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ inputs.target }}${{ inputs.release && '--release' || '' }}

      - name: Install mingw-w64 (windows-gnu only)
        if: inputs.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install cross
        if: inputs.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Build (cross)
        if: inputs.use_cross
        env:
          TARGET: ${{ inputs.target }}
          CARGO_FLAGS: ${{ inputs.cargo_flags }}
          RELEASE_FLAG: ${{ inputs.release && '--release' || '' }}
        run: cross build $RELEASE_FLAG --target "$TARGET" $CARGO_FLAGS

      - name: Build (native)
        if: ${{ !inputs.use_cross }}
        env:
          TARGET: ${{ inputs.target }}
          CARGO_FLAGS: ${{ inputs.cargo_flags }}
          RELEASE_FLAG: ${{ inputs.release && '--release' || '' }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build $RELEASE_FLAG --target "$TARGET" $CARGO_FLAGS

      - name: Upload binary artifact (release)
        uses: actions/upload-artifact@v6
        if: ${{ inputs.release }}
        with:
          name: ${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/release/weather-oxide*
            !target/${{ inputs.target }}/release/weather-oxide*.d

      - name: Upload binary artifact (debug)
        uses: actions/upload-artifact@v6
        if: ${{ !inputs.release }}
        with:
          name: ${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/debug/weather-oxide*
            !target/${{ inputs.target }}/debug/weather-oxide*.d
