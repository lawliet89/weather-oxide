name: Build (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Rust Target Triple
        type: string
        required: true
      cargo_flags:
        description: Cargo flags
        type: string
        default: ""
        required: false
      release:
        description: Do a release build
        type: boolean
        default: true
        required: false
      runs_on:
        description: What to run on
        type: string
        default: "ubuntu-latest"
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: haya14busa/action-cond@v1
        id: release_flag
        with:
          cond: ${{ inputs.release }}
          if_true: "--release"
          if_false: ""

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ inputs.target }}${{ steps.release_flag.outputs.value }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build
        run: |
          if [[ "${{ inputs.target }}" == *"musl"* ]]; then
            cross build ${{ steps.release_flag.outputs.value }} --target ${{ inputs.target }} ${{ inputs.cargo_flags }}
          else
            cargo build ${{ steps.release_flag.outputs.value }} --target ${{ inputs.target }} ${{ inputs.cargo_flags }}
          fi

      - name: Upload binary artifact (release)
        uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: ${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/release/weather-oxide*
            !target/${{ inputs.target }}/release/weather-oxide*.d

      - name: Upload binary artifact (debug)
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: ${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/debug/weather-oxide*
            !target/${{ inputs.target }}/debug/weather-oxide*.d
